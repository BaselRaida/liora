<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liora · ليورا — إدارة المخزون</title>
  <meta name="theme-color" content="#C2577A">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-logo">
      <div>
        <div class="brand-name">Liora</div><div class="brand-ar">ليورا</div>
        <div class="brand-sub" id="shopName">إدارة المخزون</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">صُنع بحُب 🌸</div>
  </aside>

  <main>
    <header class="topbar">
      <img src="icon.svg" alt="" class="top-logo">
      <h1 id="pageTitle">الرئيسية</h1>
      <div class="top-actions">
        <button class="btn btn-soft" onclick="openSaleForm()">+ بيع</button>
        <button class="btn btn-primary" onclick="openPurchaseForm()">+ بضاعة</button>
      </div>
    </header>
    <section id="view"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()"></div>
  <div class="toast" id="toast"></div>
  <datalist id="dl-prod"></datalist>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
